name: Keep Database Alive

on:
  schedule:
    # Every day at 03:00 UTC (10:00 Asia/Bangkok) to keep the database active.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx prisma/keep-alive.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
